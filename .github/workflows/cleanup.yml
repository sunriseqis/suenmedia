name: SuenMedia 十五日深度清洗

on:
  schedule:
    - cron: '0 3 1,16 * *' # 每 15 天执行一次（每月 1 日和 16 日 03:00 UTC）
  workflow_dispatch:
    inputs:
      days:
        description: '审查门槛（天数，默认 90 天前数据）'
        required: false
        default: '90'
      dry_run:
        description: '演练模式（仅排查不写磁盘：true / false）'
        required: false
        default: 'false'

jobs:
  deep-cleanup:
    name: 深度清洗
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装项目依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行冷数据探活清洗
        run: |
          DAYS="${{ github.event.inputs.days || '90' }}"
          DRY="${{ github.event.inputs.dry_run || 'false' }}"
          if [ "$DRY" = "true" ]; then
            python cleanup.py --days $DAYS --dry-run
          else
            python cleanup.py --days $DAYS
          fi

      - name: 提交清洗后精简数据
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add product/ 2>/dev/null || true
          git commit -m "清洗: 定时深度清洗全失活死链数据 [$(date +'%Y-%m-%d')]" || echo "无失效死链需要清理"
          git pull origin main --rebase || true
          git push origin main || echo "无变更提交"